[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbridge"
version = "0.1.0"
description = "Reproducible data-integration and data-quality platform for African maternal and child health indicators"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
dashboard = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local PostgreSQL service (skipped if unreachable)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
