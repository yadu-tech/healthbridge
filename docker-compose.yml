services:
  db:
    image: postgres:16
    container_name: healthbridge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-healthbridge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: keeps database files out of the OneDrive-synced project folder.
      - healthbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pipeline commands, run on demand:
  #   docker compose run --rm pipeline python -m healthbridge.staging migrate
  # The profile keeps it from starting with `docker compose up`.
  pipeline:
    profiles: ["tools"]
    build: .
    image: healthbridge:local
    command: ["python", "-m", "healthbridge.staging", "migrate"]
    environment: &appenv
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"  # the port inside the compose network, not the published one
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-healthbridge}
    volumes:
      # Snapshots and reports stay on the host; the image holds code only.
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    profiles: ["app"]
    build: .
    image: healthbridge:local
    environment: *appenv
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  healthbridge_pgdata:
